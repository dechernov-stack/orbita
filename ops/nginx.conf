# Раздача клиента и проксирование API.
#
# Клиент и API на одном origin намеренно: тогда в клиенте нет ни адреса API,
# ни CORS-настройки, и `/api` значит одно и то же в разработке (прокси Vite)
# и в контейнере (здесь).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ассеты Cesium весят десятки мегабайт — без сжатия глобус грузится долго.
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://api:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Предрасчёт геометрии и прогон Монте-Карло идут секунды, а не
        # миллисекунды: обрыв по умолчанию (60 с) сорвал бы экран баллистики.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Собранные ассеты именованы хешом содержимого — их можно кэшировать долго.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /cesium/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
