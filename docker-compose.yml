# Демонстрационный стенд «Орбиты»: база, заполнение демо-проектом, API, клиент.
#
#   docker compose up --build        поднять
#   открыть http://localhost:8080
#
# Порт хоста меняется переменной ORBITA_PORT. Пароль базы — ORBITA_DB_PASSWORD;
# значение по умолчанию годится только для локального стенда, для сервера его
# задают через .env, которого в репозитории нет и быть не должно: в репозитории
# лежит ШАБЛОН .env.example — перечень переменных с пояснениями и без значений.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: orbita
      POSTGRES_PASSWORD: ${ORBITA_DB_PASSWORD:-orbita}
      POSTGRES_DB: orbita
    volumes:
      - orbita-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbita -d orbita"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # Разовое заполнение демо-проектом «Орбита-IoT». Отдельный образ: фикстуры
  # в образ изделия не попадают (STEP-7-9 §7.2).
  #
  # Стенд по умолчанию поднимается ПУСТЫМ (ADR-028): демо — отдельный профиль
  #   docker compose --profile demo up
  # Иначе первый экран показывал бы чужой проект, а «пусто» и «сломано»
  # обязан различать экран — и он различает (три состояния на каждом).
  seed:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: ops/api.Dockerfile
      target: seed
    environment:
      ORBITA_DB_URL: jdbc:postgresql://db:5432/orbita
      ORBITA_DB_USER: orbita
      ORBITA_DB_PASSWORD: ${ORBITA_DB_PASSWORD:-orbita}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Служба обмена ReqIF (ADR-023): отдельный рантайм, наружу не публикуется.
  exchange:
    build:
      context: .
      dockerfile: ops/exchange.Dockerfile
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: ops/api.Dockerfile
      target: api
    environment:
      ORBITA_DB_URL: jdbc:postgresql://db:5432/orbita
      ORBITA_DB_USER: orbita
      ORBITA_DB_PASSWORD: ${ORBITA_DB_PASSWORD:-orbita}
      ORBITA_HTTP_PORT: 8090
      # В контейнере петля недоступна nginx (502 на /api). Порт наружу
      # не публикуется, единственный вход — nginx, поэтому 0.0.0.0 здесь
      # не открывает API в сеть хоста.
      ORBITA_HTTP_BIND: 0.0.0.0
      ORBITA_EXCHANGE_URL: http://exchange:8091
      # ADR-048: адаптер Capella включается флагом; без него — fixture с баннером
      ORBITA_CAPELLA_URL: ${ORBITA_CAPELLA_URL:-}
      # ADR-049: StrictDoc-канал включается флагом; без него — отказ 503
      ORBITA_STRICTDOC_URL: ${ORBITA_STRICTDOC_URL:-}
      # круг 2: файлы исходных документов — при стенде, в копии О-18
      ORBITA_FILES_DIR: /files
      # Служба ИИ (П5): прямой канал к провайдеру. Пустое значение — канал
      # не настроен, и это ЧЕСТНОЕ состояние: служба работает режимом
      # закрытого контура, а вызов оставляет след в журнале с причиной.
      # Значения берутся из .env (шаблон — .env.example, в репозитории
      # лежит только он: ключи в репозиторий не попадают).
      ORBITA_AI_KEY: ${ORBITA_AI_KEY:-}
      ORBITA_AI_URL: ${ORBITA_AI_URL:-}
      ORBITA_AI_MODEL: ${ORBITA_AI_MODEL:-}
      ORBITA_AI_MAX_TOKENS: ${ORBITA_AI_MAX_TOKENS:-}
      ORBITA_AI_PRICE_IN: ${ORBITA_AI_PRICE_IN:-}
      ORBITA_AI_PRICE_OUT: ${ORBITA_AI_PRICE_OUT:-}
    volumes:
      - orbita-files:/files
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: ops/web.Dockerfile
    ports:
      - "${ORBITA_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ADR-048: адаптер Capella (capellambse, только чтение). Не стартует по
  # умолчанию: профиль capella + путь к модели; модель монтируется :ro.
  capella:
    profiles: ["capella"]
    build:
      context: .
      dockerfile: ops/capella.Dockerfile
    environment:
      ORBITA_CAPELLA_MODEL: /model/${ORBITA_CAPELLA_AIRD:-model.aird}
    volumes:
      - ${ORBITA_CAPELLA_DIR:-./ops/capella/model}:/model:ro
    ports:
      - "127.0.0.1:8092:8092"

  # ADR-049: StrictDoc-канал (strictdoc 0.29.0, Apache-2.0). Не стартует по
  # умолчанию: профиль strictdoc; ядро ходит по ORBITA_STRICTDOC_URL.
  strictdoc:
    profiles: ["strictdoc"]
    build:
      context: .
      dockerfile: ops/strictdoc.Dockerfile
    ports:
      - "127.0.0.1:8093:8093"

volumes:
  orbita-db:
  # круг 2: файлы исходных документов; входит в резервную копию О-18
  orbita-files:
