ontology: формирование постановки из поля знаний — правила образования понятий Pre-A (Phase A — тем же файлом позже)
authority_ranks:
  mandatory: заказчик · регулятор · директива — вес нормы; конфликт по умолчанию за ним
  expert: 'ручной ввод эксперта проекта: автор · роль · дата; выше справки, ниже документа заказчика; без якоря'
  reference: аналитика · наследие · даташит — свидетельство
  doubtful: непроверенный — принимается только явно
concepts:
  stakeholder:
    from_facts:
    - kind: relation
      predicate_in:
      - является заказчиком
      - является оператором
      - регулирует
      - поставляет
      - учреждается
      - потребляет
    - kind: capability
      subject: организация
    fields:
      name: subject
      role: по предикату
      interest: из facts kind=assessment|framing о subject
      scale: quantity о subject
    must_link: []
    conflict_on:
    - role
    note: сторона без нужды — помета к воротам, не отказ
    identity:
      key:
      - name_normalized|synonyms
      semantic: имя организации/группы, роль
      threshold: 0.85
    not_from:
    - автор или подписант нормативного акта без предиката роли к проекту
    - ведомство как издатель
    - сама проектируемая система
    - регион, порт, коридор — это объекты применения
    allowed_roles:
    - charter
    - tor
    - context
    - supplier
    - heritage
    computed_fields:
      influence: 'вычисляется системой из role по карте: customer→decides · regulator→decides · established→decides · operator→influences · partner→influences · supplier→influences · consumer→informed;
        модель поле не заполняет, инженер правит на месте'
      power: оценка человека 1–5 на сцене 3; по умолчанию пусто
    predicate_hints:
    - является заказчиком
    - является оператором
    - регулирует
    - поставляет
    - эксплуатирует
    - потребляет
    - учреждается
    predicate_hints_note: примеры формулировок для инструкции; НЕ фильтр — предложение не отбивается из-за отсутствия предиката в списке
    from_facts_note: подсказка, откуда понятие обычно берётся; ворота на вид факта не ставятся
  need:
    from_facts:
    - kind: framing
      predicate_in:
      - нуждается в
      - требует
      - не хватает
    - kind: assessment
      subject_is: stakeholder
      mark: П
    - section_hint: §2.1 общие нужды → привязка к сторонам по субъекту/смыслу
    fields:
      statement: предикат+объект
      stakeholder: subject (owns) — обязательно
      qos_class: множество классов из текста (A′ · B′ · C′, один или несколько); сервис уточняет один
    must_link:
    - owns→stakeholder
    conflict_on:
    - statement contradicts
    note: интерес стороны → нужда [П], не [И]
    identity:
      key:
      - stakeholder
      - statement_core
      semantic: та же потребность иными словами; отличие — охват, число, класс
      threshold: 0.8
    not_from:
    - роль стороны (поле role)
    - описание программы или акта
    - свойство системы (цель или сервис)
    allowed_roles:
    - charter
    - tor
    - context
    predicate_hints:
    - нуждается в
    - требует
    - не хватает
    - вынужден
    predicate_hints_note: примеры формулировок для инструкции; НЕ фильтр — предложение не отбивается из-за отсутствия предиката в списке
    from_facts_note: 'подсказка: нужды берутся из (а) перечня общих нужд документа, (б) интереса каждой стороны — интерес это нужда-кандидат [П], (в) прямых формулировок нехватки в прозе'
    distribution_rule: общая нужда (перечень §2.1) раздаётся сторонам с ролями заказчик · оператор · потребитель · учреждаемый, чей интерес или сфера о том же предмете; поставщикам и регуляторам общие нужды
      не достаются — их нужды только из собственного интереса
    answer_shape: нужды живут внутри стороны (stakeholders[].needs[]), у каждой ОБЯЗАТЕЛЬНЫЙ свой id вида p1.n2 — на него ссылаются цели и сервисы; ответ без id у нужды — недействителен
  goal:
    from_facts:
    - kind: quantity
      with: horizon/year
    - kind: framing
      predicate_in:
      - к году
      - достичь
      - развернуть
    fields:
      statement: предикат
      measure: quantity с единицей — обязательно
      year: horizon — обязательно
      needs: covers ≥1 по субъекту/теме
    must_link:
    - covers→need>=1
    conflict_on:
    - measure
    - year
    note: цели проекта меняются только решением эксперта; всякий документ может предложить изменение с основанием и рангом — не создать цель сам
    identity:
      key:
      - statement_core
      - measure.key
      semantic: тот же результат; отличия — значение, год, единица (нормализовать)
      threshold: 0.8
    not_from:
    - обязательство норматива (constraint)
    - описание услуги (service)
    allowed_roles:
    - charter
    change_by_others: только предложение augment/contradict с обоснованием; решает человек
    predicate_hints:
    - достичь
    - развернуть
    - к году
    predicate_hints_note: примеры формулировок для инструкции; НЕ фильтр — предложение не отбивается из-за отсутствия предиката в списке
    from_facts_note: подсказка, откуда понятие обычно берётся; ворота на вид факта не ставятся
  service:
    from_facts:
    - kind: capability
      subject: система
    - section_hint: §4 сервисы
    fields:
      name: capability
      needs: covers ≥1
      qos_class: из фактов о классе/задержке
      target_measure: quantity
    must_link:
    - covers→need>=1
    - qos_class
    conflict_on:
    - qos_class
    - target_measure
    identity:
      key:
      - name_core
      semantic: та же услуга тем же потребителям
      threshold: 0.8
    not_from:
    - сервис без нужды не предлагается
    allowed_roles:
    - charter
    change_by_others: только предложение augment/contradict с обоснованием; решает человек
    from_facts_note: подсказка, откуда понятие обычно берётся; ворота на вид факта не ставятся
  constraint:
    from_facts:
    - kind: obligation
    - kind: framing
      predicate_in:
      - только
      - не рассматривается
      - исключается
      - не более
      - не менее
    fields:
      code: Р-N выдаётся при акцепте
      type: 'по источнику: obligation→regulatory; framing→technical|programmatic|launch|financial'
      bound: из quantity в факте, если есть
    must_link:
    - normative_basis if obligation
    conflict_on:
    - bound
    - statement
    note: ограничение из справочного документа — предложение [П], из обязательного — [И]
    identity:
      key:
      - bound.key|statement_core
      semantic: та же рамка; отличие — граница или тип
      threshold: 0.85
    not_from:
    - желание стороны (need)
    - целевой показатель (goal)
    allowed_roles:
    - charter
    - tor
    - regulatory
    predicate_hints:
    - только
    - не рассматривается
    - исключается
    - не более
    - не менее
    predicate_hints_note: примеры формулировок для инструкции; НЕ фильтр — предложение не отбивается из-за отсутствия предиката в списке
    from_facts_note: подсказка, откуда понятие обычно берётся; ворота на вид факта не ставятся
  assumption:
    from_facts:
    - mark: П
    - kind: assumption
    fields:
      disposition: assumed — ставится при приёме предложения
      assumption.owner: человек, при акцепте
      assumption.confirm_by: точка, при акцепте
      assumption.validation: чем подтвердится, при акцепте
      statement: остаётся текстом факта
    must_link: []
    conflict_on: []
    identity:
      key:
      - statement_core
      semantic: то же допущение
      threshold: 0.8
    allowed_roles:
    - charter
    - tor
    - context
    - supplier
    - heritage
    target_kind: fact (disposition=assumed) — отдельного вида нет
    note: предложение синтеза для допущения = «пометить факт как допущение»; владельца, точку и способ подтверждения ставит человек — модель их не предлагает; реестр допущений — проекция фактов с диспозицией
      assumed
    from_facts_note: подсказка, откуда понятие обычно берётся; ворота на вид факта не ставятся
  milestone:
    from_facts:
    - kind: event
      with: date|year
    - section_hint: §7 этапы
    fields:
      name: событие
      date: из факта
      fleet: quantity если есть
    must_link: []
    conflict_on:
    - date
    identity:
      key:
      - name_core
      semantic: тот же этап/событие; отличие — дата
      threshold: 0.85
    target_kind: milestone (L1); вехи технологий — gate
    allowed_roles:
    - charter
    - regulatory
    - context
    from_facts_note: подсказка, откуда понятие обычно берётся; ворота на вид факта не ставятся
    note: веха из устава — только этап проекта (program_stage) с горизонтом или диапазоном; срок действия документа, дата акта, событие рынка — не веха, а факт event или valid_until норматива
  normative_document:
    from_facts:
    - kind: obligation
      with: designation
    fields:
      designation: natural key
      edition: из факта
      clauses: пункты фактами; limit — полем
    must_link: []
    conflict_on:
    - edition
    identity:
      key:
      - designation_natural
      semantic: —
      threshold: 1.0
    allowed_roles:
    - regulatory
    - charter
    - tor
    from_facts_note: подсказка, откуда понятие обычно берётся; ворота на вид факта не ставятся
    from_hint: 'перечень НПА устава (§2.2) читается построчно: обозначение · номер · дата · редакция · срок — каждая строка → норматив; пункты — при наличии текста акта'
  opportunity:
    target_kind: opportunity (L2)
    from_facts:
    - kind: external_need
    - kind: external_target
    - kind: framing
      predicate_in:
      - требует
      - нуждается в
      - не хватает
      subject_not: stakeholder проекта
    fields:
      external_item: факт чужой нужды/цели с якорем
      owner: сторона или программа, чья она
      our_services: сервисы и узлы, которыми закрывается
      verdict: закрываем · частично · не наш профиль · нужна доработка
      missing: чего не хватает (параметры, требования, сервисы)
      scale: объекты/объём/деньги из фактов
      proposal: 'предложение эксперту: расширить зону · добавить сервис · в descopes · отклонить'
    must_link:
    - external_item→fact
    note: возможность не становится целью; она обосновывает цель или порождает предложение эксперту; «не наш профиль» — законный и ценный вердикт, опирается на границы устава
    from_facts_note: подсказка, откуда понятие обычно берётся; ворота на вид факта не ставятся
    identity:
      key:
      - external_item.statement_core
      - owner
      semantic: та же чужая нужда или цель того же владельца, сказанная иначе
      threshold: 0.8
    conflict_on:
    - verdict
    - missing
    conflict_note: два документа дают разный вердикт применимости к одной чужой нужде — contested с обоими и их ролями
  intent:
    target_kind: intent
    allowed_roles:
    - charter
    from: '§1 устава: для кого · что делает · где · горизонт — четыре поля цитатами'
    fields:
      for_whom: ''
      what: ''
      where: ''
      horizon: ''
      accepted_by: ставит система при принятии решением
      accepted_at: ставит система при принятии решением
    must_link: []
    identity:
      key:
      - project
      semantic: —
      threshold: 1.0
    note: один на проект; правится только решением
  requirement:
    target_kind: requirement
    allowed_roles:
    - tor
    - charter (только при явном разделе «требования к миссии»)
    from: 'ТЗ: требования заказчика — читаются; устав: только явный раздел требований. Требования уровня проекта из целей, нужд и ограничений НЕ читаются из документа — они образуются на сцене 8 (деривация
      из принятой постановки, решением инженера)'
    fields:
      code: выдаёт система
      title: ''
      statement: формулировка как в тексте
      measure: '{value|min,max,unit} если есть'
      carrier: пусто — ставит инженер на сцене 8
      source: цитата + якорь
    must_link: []
    identity:
      key:
      - statement_core
      semantic: то же требование иными словами
      threshold: 0.85
    conflict_on:
    - measure
    note: мера чтения устава без явного раздела — 0 требований; мера сцены 8 — 12 требований из постановки (ПОСТАНОВКА-ИЗ-ЗАПИСКИ.requirements как ожидание)
  risk:
    target_kind: risk
    allowed_roles:
    - charter
    - tor
    - context
    - supplier
    - heritage
    from: раздел рисков документа или оценка с последствием («если … то …»)
    fields:
      statement: ''
      cec: '{condition,event,consequence} если в тексте так'
      category: technical|cost|schedule|safety|regulatory|security|programmatic
      owner: пусто — ставит человек
      due_point: пусто — ставит человек
      probability: пусто — ставит человек (1–5, сцена 11)
      impact: пусто — ставит человек (1–5, сцена 11)
      strategy: пусто — ставит человек (сцена 11)
      measures: мера снижения из документа, если названа; иначе пусто — ставит человек
    must_link: []
    identity:
      key:
      - statement_core
      semantic: тот же риск
      threshold: 0.8
    conflict_on: []
    note: вероятность и последствия 1–5 — ставит человек; из документа только формулировка и класс
reconciliation:
  new: понятие без совпадения по ключу и смыслу
  augment: совпадение по ключу; новые поля/связи → предложение «дополнить»
  contradict: совпадение по ключу; различие в conflict_on → contested с рангами обоих
  confirm: совпадение полностью из независимого документа → evidence=corroborated
  manual_edit: правка принятого без факта → предложить ручной факт [И] или помету «без основания»
  manual_input: 'ручной ввод → кандидат-факт authority=expert → та же сверка: дубль (ключ, затем семантика по срезу понятия) · противоречие (conflict_on после нормализации) · соединение (supports/refines,
    must_link) · нехватка (must_link) — предложения с уверенностью и полем отличия; выполняет только человек'
  batching: несколько ручных вводов — один вызов сверки с задержкой; срез ≤ 50 фактов и сущностей
  rights: ИИ не сливает, не переписывает принятое, не выбирает победителя; «похоже» без «чем именно» — брак
invariants:
- принятое не меняется синтезом молча
- понятие с must_link незакрытым — предложение с пометой, не сущность
- ранг документа не решает за человека — подсказывает
- каждое предложение несёт факты-основания (≥1) с якорями и рангами
prompt_render:
  facts: 'каждый факт записью: код · вид · ранг · метка · якорь · тема; субъект · предикат · объект · значение с единицей — отдельными полями'
  accepted: 'принятое — с полями, по которым бывает вердикт (для goal: statement, measure, year; для need: statement, stakeholder, qos_class …)'
  scope: 'понятия — только для текущей сцены; порядок: стороны → нужды → цели/сервисы'
  refs: 'ссылка на сторону/нужду: code принятого либо ref предложения того же ответа'
  examples: на каждое понятие — пример «из фактов → предложение» и анти-пример (not_from)
  self_check: перед выводом — список проверок; не прошедшее удаляется, не исправляется
  source: ПРОМПТ-ФОРМИРОВАНИЕ-V2.md
  example_contract: 'образец ответа в промпте — часть контракта и сильнее текста правил: модель копирует образец. Образцы порождаются из схемы ответа и онтологии, руками не пишутся'
document_roles:
  charter: устав миссии — единственный источник целеполагания; в проекте один
  tor: источник требований (ТЗ заказчика) — требования, ограничения, стороны, нужды заказчика; целей проекта не порождает
  regulatory: норматив — нормативные документы и пункты, ограничения regulatory, вехи сроков; сторон и целей не порождает (издатель — не сторона)
  context: обстановка (исследования, аналитика) — стороны-кандидаты, применения, факты о чужих целях и программах, обоснования, риски; целей и сервисов не порождает
  supplier: поставщик (даташит, КП) — параметры, кандидаты решений, стоимости, риски
  heritage: наследие — уроки, типовые риски, параметры, обоснования
goal_hierarchy:
  rule: цели, сервисы и горизонты проекта образуются только из charter; прочие роли могут confirm · contradict · augment · обосновать, но не создать
  external_target: факт вида external_target — цель чужой программы/заказчика; в реестр целей проекта не попадает
charter_prism:
  source: документ роли charter
  fields:
  - что строим (класс системы)
  - чего не строим (границы)
  - сервисы
  - цели с показателями
  - рамки Р
  - приоритетные зоны
  use: подставляется в промпт разбора и синтеза любого другого документа как точка отсчёта
  requirements: ТРЕБОВАНИЯ-К-ЗАПИСКЕ-МИССИИ — 12 пунктов минимума, полнота проверяется при загрузке
reading_questions:
- что подтверждает, уточняет или оспаривает в принятом
- чьи цели и нужды здесь названы (external_target / external_need) и чьи они
- чем наша система может быть им полезна → opportunity с вердиктом
- что здесь обязательно или запрещено для нас (ограничения, нормы, риски)
verdict_rule: вердикт о принятом выносят только вопросы тождества — дубль и противоречие; соединение и нехватка о принятом не говорят ничего (иначе кандидат молча признаётся узнанным)
gates:
  machine_checkable_only:
  - цитата дословно есть в каноне
  - якорь указывает на блок с цитатой
  - число с единицей из справочника; порог — полем
  - ссылки разрешаются (нужда→сторона, цель→нужды)
  - обязательные поля понятия заполнены
  - дубль по ключу идентичности — предложение слияния
  never:
  - судить о виде факта
  - требовать предиката из списка
  - отбивать содержательное предложение по форме
reading_mode:
  rule: 'документ читается смыслом, структура раздела — как структура: таблица построчно, перечень по пунктам, проза прозой'
  section_map: 'в промпт подаётся карта разделов канона: якорь · тип (таблица|перечень|проза) · заголовок · колонки таблицы'
  output: ИИ отдаёт понятия сразу, каждое с цитатой и якорем; факт — след предложения (цитата + нормализованное утверждение), не предварительный фильтр
  source: ПРОМПТ-РАЗБОР-В-ПОСТАНОВКУ.md · РЕШЕНИЕ-ЧИТАТЬ-СМЫСЛ.md
influence_map:
  customer: decides
  regulator: decides
