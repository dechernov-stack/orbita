  engine: новый
versioning_rules:
- правка поля → новая версия объекта (автор, valid_from); старая остаётся
- правка после baseline → только с basis; помета after_baseline_changed; связи объекта → suspect
- правка параметра → новая версия parameter; модели, читавшие старую, помечаются «вход изменился»
- baseline → неизменяемый снимок items[{ref,version}] + .sdoc; перебазирование гасит пометы для вошедших версий
- отмена → Cancelled с историей; из baseline не исчезает
- диф baseline↔baseline → добавлено · изменено (поле в поле) · удалено
capella_alignment:
  requirement: Requirements Viewpoint Requirement (ReqIFIdentifier/LongName/Text/ChapterName + атрибуты ORBITA.*); владелец — Орбита
  link req↔req: InternalRelation (тип = вид связи)
  link req→element: CapellaOutgoingRelation/IncomingRelation, RelationType = вид связи; создаёт Орбита
  component: PA PhysicalComponent (node/behaviour), иерархия ownedPhysicalComponents; при наличии модели — Capella владеет структурой
  component_usage: PVMT property quantity
  parameter: PVMT property values, группа ORBITA, единицы справочника
  interface: PA PhysicalLink + ComponentPort
  function: SystemFunction/LogicalFunction; allocation → ComponentFunctionalAllocation
  functional_chain: FunctionalChain
  capability: OperationalCapability/Capability
  identity: UUID элемента Capella = external_identity; имя/тип/слой — снимок с датой
  direction: требования → Capella (ReqIF); архитектура → Орбита (capellambse read-only); обратных записей нет
  component.nature: PhysicalComponent nature Node|Behaviour; deployed_on → deployment
  exchange_item: ExchangeItem (FLOW/OPERATION/EVENT/SHARED_DATA) + ExchangeItemElement, типы — Information layer
  state_machine: State Machine на компоненте; Mode/State; функции «available in mode»
  budget compute/data: PVMT-группа ORBITA.SW, свёртка по behaviour на node
versioning_unit:
  unit: атомарная сущность (запись-снимок), не поле; ветвлений нет
  atomic_kinds:
  - requirement
  - link
  - parameter
  - component
  - component_usage
  - interface
  - insertion
  - prose
  - section
  - document
  - decision
  - constraint
  - goal
  - need
  - stakeholder
  - service
  - risk
  - technology
  - baseline (immutable)
  field_classes:
    substantive: 'умолчание: новая версия; после baseline — basis обязателен; связи → suspect'
    auxiliary: история без версии и без suspect
    computed: не хранится
  auxiliary_fields_default:
  - notes
  - tags
  - comment
  - name_snapshot
  - refreshed_at
  - display_*
  version_record:
    fields:
    - version
    - valid_from
    - valid_to
    - recorded_at
    - actor
    - basis?
    - changed_fields[]
    rule: changed_fields считается при записи по содержательным полям
  concurrency: optimistic lock by version
  baseline_reference: items[{ref, version}] — версии атомарных сущностей
units_to_add:
- тыс. строк (счётная)
- Н·м (момент)
- категория критичности ПО — шкала method_catalog
maturity_ladder:
  gates:
  - MCR
  - SRR
  - SDR
  - PDR
  rule: required_to=N ⇒ обязательно на N и далее; готовность считает незакрытые грани текущей ступени разрывами, следующей — приглашениями
  margins:
    by_class:
      estimated: 20
      modified: 10
      off_the_shelf: 5
      measured: 2
    system_by_gate:
      MCR: 20
      SRR: 15
      SDR: 10
      PDR: 5
  source: ПОЛКА-ШАБЛОНЫ-КОМПОНЕНТОВ.json
trl_gating:
  SRR: условные элементы допустимы
  SDR: условные — только с maturation_package и оценкой
  PDR: 'условных нет: TRL≥6 или fallback'
  rule: firm-базирование элемента с depends_on_technology при trl_current<trl_required — отказ
input_document_pipeline:
  parse_mode_by_type:
    mission_memo: full
    tor: full+assessment
    directive: registry
    normative: clauses
    datasheet: parametric
    quote: registry
    external_icd: parametric
    external_model: structural
    analysis: full+derived
    heritage: full
    regulatory_decision: registry
    reference: none
  stale_rule: новая версия входного (supersedes) → диф канонов блоками → сущности с source в изменённых блоках получают помету «источник обновлён»
  classification_rule: dsp/commercial — не уходят во внешний контур без явного разрешения; state_secret — не загружается
intake_rules:
- факт без якоря не существует; величина без единицы — не факт
- внешний источник → [В] с датой снимка
- конфликт фактов — показать оба, не выбирать
- действия только после акцепта плана
- задание вне каталога → вопрос
- гриф источника наследуется фактами и действиями
- повторная загрузка того же источника → диф снимков → пометы «источник обновлён»
knowledge_field_rules:
- adopted ⇒ существует объект с derived_from_fact (сторож)
- assumed ⇒ owner, confirm_by, validation (сторож)
- contested с участием adopted-факта — блокирующий разрыв точки
- topic с adopted-фактами обязана разрешиться в сущность к точке
- диспозицию меняет человек; ИИ предлагает
- новая версия источника → superseded + пометы, диспозиции не трогаются
- rejected не удаляется
- к PDR принятые величины ≥ corroborated
prompt_sources:
  factology: факты с disposition adopted|assumed|noted (не rejected), с якорями
document_rules:
- в структуре нет свободного текста, кроме statement; statement с числом без supports — помета
- полнота = ожидания шаблона на ступень; готовность читает полноту, не существование
- rendering — только из элементов (вид document_render); число в тексте без элемента — отказ выпуска
- правка сути в тексте запрещена; правка изложения — style_patch с автором
- baseline документа фиксирует версии разделов, элементов и их опор; изменение опоры → support_changed с дифом
- авторы выпуска = авторы элементов + рецензент + выпустивший
standards_map:
  stages:
    Pre-A: РК-11КТ стадия 1 · НИР (в РК-11КТ отсутствует как обязательная)
    Phase A: стадия 2 · аванпроект
    Phase B: стадия 3 · эскизный проект
    Phase C/D: стадии 4–5 · РД, изготовление, испытания; госиспытания
    Phase E: стадия 6 · эксплуатация
    Phase F: стадия 7 · утилизация
  gates:
    MCR: экспертиза замысла / облика миссии
    SRR: экспертиза требований к миссии/системе
    SDR/MDR: экспертиза облика системы
    PDR: экспертиза аванпроекта
    CDR: экспертиза эскизного проекта
  source: romanov.png — процессы ЖЦ модельно-ориентированного инжиниринга; ГОСТ ISO 15288-2023; ГОСТ ISO 24641-2023
  rule: модель без verification_status=verified не даёт выхода в baseline
process_tracks:
  design: требования → архитектура → оценка → синтез
  modeling: модель пользователей → ЖЦ → функциональная → требований → критерии → верификация → системные/интегральные модели
  management: планы стадии (SEMP, технологии, риски, информация, верификация, логистика…)
  source: ПОЛКА-ПРОЦЕССЫ-РОМАНОВ.json
artifact_maturity_ladder:
  codes:
  - С
  - Р
  - F
  - U
  - Σ
  - Δ
  - x
  - °
  rule: код зрелости артефакта к точке обязателен и монотонен по стадиям; DMN точки строится из control_items
  source: ПОЛКА-ПРОЦЕССЫ-РОМАНОВ.maturity_matrix (113 артефактов × 5 экспертиз)
