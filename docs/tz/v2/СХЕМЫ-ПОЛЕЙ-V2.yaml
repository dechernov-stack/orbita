write_rules:
  schema_on_write: 'любая запись сущности валидируется истиной: поле вне схемы вида — отказ, а не молчаливое сохранение'
  print_queries: запрос печати ссылается только на поля истины; неизвестное поле — отказ сборки (validate_document_queries)
aoa_rule: 'сравнение вариантов: строки — варианты, столбцы — метрики по группам, значение — из прогона, порог — у метрики; отсев по порогу с именем порога; Парето по направлениям метрик; итогового балла
  нет; базовая концепция ссылается на вариант с обоснованием'
scene_responsible_rule: условие «ответственные сцен» читает окна плана; незаполненное — умолчание из ролей проекта; назначение — на A1/сцене 1 и в паспорте
manual_fact_rule: 'ручной факт заводится экраном поля знаний только через сверку (СВЕРКА-РУЧНОГО-ВВОДА): предложения под строкой, решение человека; ворота «ввод не сверен» верны, обход их запрещён'
assumption_register_rule: 'реестр допущений (MCReport §10, SEMP) — факты с disposition=assumed, независимо от метки происхождения: метка «П» говорит, что источник предположил; допущением факт становится
  решением (владелец + точка). Факт «П» без диспозиции — кандидат в допущения, в §10 не печатается; запросы шаблонов читают disposition, не source_mark'
